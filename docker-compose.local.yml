# Local development dependencies only. Run the SendLit API and web app on the host.
#
#   docker compose -f docker-compose.local.yml up -d
#   pnpm --filter @sendlit/api db:push
#   pnpm dev:api
#
# Defaults are intentionally distinct from the CourseLit and FrontLit local
# Compose stacks so all three can run at the same time.
# Host ports: Postgres 5434, Redis 6380, Mailpit SMTP 1027, Mailpit UI 8027.
name: sendlit-local

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sendlit
      POSTGRES_USER: sendlit
      POSTGRES_PASSWORD: sendlit
    ports:
      - "127.0.0.1:${SENDLIT_LOCAL_POSTGRES_PORT:-5434}:5432"
    volumes:
      - sendlit-local-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sendlit -d sendlit"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${SENDLIT_LOCAL_REDIS_PORT:-6380}:6379"
    volumes:
      - sendlit-local-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SENDLIT_LOCAL_MAILPIT_SMTP_PORT:-1027}:1025"
      - "127.0.0.1:${SENDLIT_LOCAL_MAILPIT_HTTP_PORT:-8027}:8025"

volumes:
  sendlit-local-postgres-data:
  sendlit-local-redis-data:
