name: Publish Docker image

on:
  push:
    tags:
      # Release tags only, e.g. v1.2.0. Keeps package-style tags out of this workflow.
      - "v*"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  publish-docker-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Self-hosters run on both amd64 servers and arm64 machines (Graviton, Apple silicon).
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERNAME }}
          password: ${{ secrets.DOCKERTOKEN }}

      - name: Docker meta for API
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: codelit/sendlit
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push API
        id: docker_build_api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Image digest (API)
        run: echo "${{ steps.docker_build_api.outputs.digest }}"

      - name: Docker meta for Web app
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: codelit/sendlit-web
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Web app
        id: docker_build_web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Image digest (Web app)
        run: echo "${{ steps.docker_build_web.outputs.digest }}"
