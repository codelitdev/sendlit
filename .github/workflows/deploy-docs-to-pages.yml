name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - "apps/docs/**"
      - "packages/api-contract/**"
      - "packages/email-blocks/**"
      - "packages/email-editor/**"
      - ".github/workflows/deploy-docs-to-pages.yml"
      - "bun.lock"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-docs"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: |
          bun --filter @sendlit/email-editor build
          bun --filter @sendlit/email-blocks build

      - name: Build docs site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bun --filter @sendlit/docs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./apps/docs/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
