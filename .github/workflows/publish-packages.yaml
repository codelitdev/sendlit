name: Publish NPM packages

on:
    push:
        branches:
            - main
        tags-ignore:
            - "**"

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
    CI: true

jobs:
    publish-packages:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            pull-requests: write
        steps:
            - name: checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Configure CI Git User
              run: |
                  git config --global user.name 'CodeLit'
                  git config --global user.email 'hi@codelit.dev'

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.1

            # changeset publish runs npm publish, which needs Node and the registry URL.
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org

            - name: Install Packages
              run: bun install --frozen-lockfile

            - name: Create and publish versions
              id: changesets
              uses: changesets/action@v1
              with:
                  commit: "chore: update versions"
                  title: "chore: update versions"
                  publish: bun run ci:publish
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Echo changeset output
              run: echo "${{ steps.changesets.outputs.hasChangesets }}"
