name: Testing
on:
    pull_request:
    push:
        branches:
            - "**"
        tags-ignore:
            - "*"

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        services:
            # The ESP send-rate limiter is tested against a real Redis.
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.1
            - run: bun install --frozen-lockfile
            - run: bun run build:packages
            - run: bun run test
