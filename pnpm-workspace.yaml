packages:
  - "packages/*"
  - "apps/*"

allowBuilds:
  "@scarf/scarf": false
  esbuild: true
  msgpackr-extract: true
  protobufjs: false
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@codelitdev/design-system@0.1.0-alpha.0 || 0.1.0-alpha.2'

overrides:
  "@types/node": ^22.14.1
